[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ReHeat"
version = "0.1.0"
description = "A Python package for designing hybrid renewable heating systems"
authors = [
    {name="Gustavo Campos", email="gustavo.campos@nlr.gov"},
    {name="Parthiv Kurup", email="parthiv.kurup@nlr.gov"},
    {name="Sertac Akar", email="sertac.akar@nlr.gov"},
]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyomo",
    "cloudpickle",
]
